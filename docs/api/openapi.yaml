openapi: 3.1.0
info:
  title: Synca API
  version: "1.2"
  description: >
    Synca is a health-based dating app. This API serves iOS and Android clients.
    All health data is aggregated on-device before being sent. Raw HealthKit/Health Connect
    samples are never stored or transmitted.

    **Live interactive docs** (when running locally): `GET /api-docs`
    — powered by Scalar. The source of truth is `docs/api/openapi.yaml`,
    kept in sync with controller tests.

    **Status legend** used on individual operations below:
    - *(implemented)* — matches `backend/api/app/controllers` today, verified against the
      controller/contract/serializer source as of this revision.
    - *(needed — not yet implemented)* — required by the iOS app (see
      `docs/architecture/ios-structure.md`, `apps/ios/Synca/`) but has no Rails controller yet.
      Tracked in `docs/product/decisions.md`. Do not assume these work against a running server.
  contact:
    name: Synca Engineering
servers:
  - url: http://72.56.97.181/api/v1
    description: >
      Production (terminus VPS) — actually live today. Plain HTTP, no domain/TLS
      yet; see backend/api/README.md § Deploying to Production (terminus).
  - url: https://api.synca.app/api/v1
    description: >
      Production (future) — this domain isn't purchased/DNS-configured yet;
      do not use until a real deploy targets it.
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, guest onboarding, login, token refresh, activation
  - name: Profile
    description: User profile management
  - name: Health
    description: Aggregated health summary upload
  - name: Preferences
    description: Declared-preferences questionnaire (also doubles as the Spark micro-questionnaire)
  - name: Matching
    description: Compatibility scores and match list
  - name: Spark
    description: Synca Spark — live in-person compatibility sessions
  - name: DateProposals
    description: >
      Date proposal lifecycle. Phase 1 (Moments, see docs/features/moments-v1.md).
      No backend model/controller exists yet — this section is a forward-looking
      contract, not a description of running code.

paths:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new full account (implemented)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  $ref: '#/components/schemas/UserSignup'
            examples:
              email_signup:
                summary: Email registration
                value:
                  auth:
                    email: "user@example.com"
                    password: "password123"
                    auth_provider: 0
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate an existing user (implemented)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [email, password]
                  properties:
                    email:
                      type: string
                      format: email
                      example: "user@example.com"
                    password:
                      type: string
                      example: "password123"
            examples:
              valid_login:
                summary: Valid credentials
                value:
                  auth:
                    email: "user@example.com"
                    password: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token (implemented)
      description: >
        Pass the refresh_token obtained at login/register. Passing an access_token
        instead will return 401 invalid_token.
        Returns a new access_token only — the refresh_token is NOT rotated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [refresh_token]
                  properties:
                    refresh_token:
                      type: string
                      description: The refresh_token from the login/register response
            examples:
              valid_refresh:
                summary: Valid refresh token
                value:
                  auth:
                    refresh_token: "<refresh_token>"
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: New short-lived access token
              examples:
                success:
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiJ9..."
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/guest:
    post:
      tags: [Auth]
      summary: Create or resume a guest account (implemented)
      description: >
        Creates a guest account (`account_type: guest`) from an email and/or phone, or
        with neither for a fully anonymous guest — see the iOS guest-Spark flow
        (docs/features/spark-v1.md, reordered per product review — see
        docs/product/decisions.md#spark-guest-anonymous-identity), which opens a guest
        session with no identifier at all and collects email only afterwards, on the
        "Save your results" screen (`POST /auth/guest/claim_email`). Also returns a
        fresh token for an existing non-active user with the given email.
        Returns `email_already_active` if the email already belongs to an activated account.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                    password:
                      type: string
                      nullable: true
            examples:
              anonymous:
                summary: Anonymous guest (works today)
                value:
                  auth: {}
              email_only:
                summary: Guest with email (works today)
                value:
                  auth:
                    email: "guest@example.com"
      responses:
        '201':
          description: Guest session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthResponse'
              examples:
                success:
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiJ9..."
                    token_type: "Bearer"
                    expires_in: 900
                    account_type: "guest"
        '422':
          description: >
            Validation failed, or `email_already_active` if the email belongs to an
            activated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/guest/claim_email:
    post:
      tags: [Auth]
      summary: Attach an email to the current anonymous guest session (implemented)
      description: >
        Called from the "Save your results" screen, after the Spark result is shown.
        Attaches an email to the already-authenticated (anonymous) guest user without
        creating a new user record, so the Spark/health data already associated with
        this session's JWT `sub` stays linked. Distinct from `/auth/register`, which
        creates a brand-new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [email]
                  properties:
                    email:
                      type: string
                      format: email
      responses:
        '200':
          description: Email attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/activate:
    post:
      tags: [Auth]
      summary: Activate a guest account (implemented)
      description: >
        Sets `display_name` and a password, and upgrades `account_type` from
        `guest` to `active`, issuing a permanent access + refresh token pair.
        The password is required here — it's the only point in the guest flow
        where one is ever collected — so the account can later authenticate via
        `POST /auth/login`. Called from the in-session "Almost there" screen
        right after `claim_email`, and — for the deferred case where the user
        closed the app first — from the magic-link deep link described in
        docs/features/profile-v1.md.
        → Ref: docs/product/phases/phase-0.md#uf-04 · docs/features/profile-v1.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, auth]
              properties:
                profile:
                  type: object
                  required: [display_name]
                  properties:
                    display_name:
                      type: string
                auth:
                  type: object
                  required: [password]
                  properties:
                    password:
                      type: string
                activation_token:
                  type: string
                  nullable: true
                  description: >
                    Present only when activating via the out-of-band magic-link deep
                    link (user closed the app before activating in-session).
                    Omit when activating in the same session that ran the Spark.
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Profile]
      summary: Get full current user object (implemented)
      description: Returns user + profile + active health summary. Either may be null.
      responses:
        '200':
          description: Full user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Profile
  # ---------------------------------------------------------------------------

  /me/profile:
    put:
      tags: [Profile]
      summary: Update current user profile (implemented)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: object
                  required: [display_name]
                  properties:
                    display_name:
                      type: string
                    bio:
                      type: string
                    city:
                      type: string
                    gender:
                      type: string
                      enum: [male, female, non_binary, other]
                    birth_date:
                      type: string
                      format: date
                    photo_url_main:
                      type: string
                      format: uri
                    photo_urls:
                      type: array
                      items:
                        type: string
                        format: uri
                      maxItems: 6
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Health Summary
  # ---------------------------------------------------------------------------

  /me/health_summary:
    put:
      tags: [Health]
      summary: Upload aggregated health metrics (implemented)
      description: >
        Called by iOS/Android after local aggregation of HealthKit / Health Connect data.
        Raw samples must never be sent. Only aggregated metrics are accepted.
        Always updates (or creates) the active health summary (`effective_to: nil`)
        for the authenticated user. `effective_from` is required by the contract —
        the client should send today's date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health_summary]
              properties:
                health_summary:
                  $ref: '#/components/schemas/HealthSummaryInput'
      responses:
        '200':
          description: Health summary updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  health_summary:
                    $ref: '#/components/schemas/HealthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Preferences (declared preferences / Spark questionnaire)
  # ---------------------------------------------------------------------------

  /signals/preferences:
    patch:
      tags: [Preferences]
      summary: Upsert declared preferences (implemented)
      description: >
        Backs the 5-question declared-preferences questionnaire
        (docs/features/signals-v1.md). Per product decision (Igor, design review),
        this is now also the Spark on-the-spot questionnaire — asked once, right
        after scanning the QR and before the result, both for first-time guests
        (acts as their initial declared-preferences setup) and returning users
        (updates their existing record). There is no separate onboarding
        questionnaire screen. Upserts by `user_id` — no duplicate record is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  $ref: '#/components/schemas/PreferenceProfileInput'
      responses:
        '200':
          description: Updated preference profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /signals/me/summary:
    get:
      tags: [Health]
      summary: Human-readable summary of the current user's own signals (implemented)
      description: >
        Derived at request time from the active health summary and preference
        profile. Powers the Profile → "My Health" screen.
        Returns `404 no_signals` if the user has no health summary yet, or if
        `chronotype` hasn't been computed — the client should show the
        "connect Apple Health" prompt in that case.
      responses:
        '200':
          description: Signals summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/SignalsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No signals yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Matching
  # ---------------------------------------------------------------------------

  /matches:
    get:
      tags: [Matching]
      summary: Get curated match list (implemented)
      description: >
        Returns every Match the current user participates in (Spark-origin today;
        algorithm-origin is Phase 1, see docs/features/matching-v1.md).
        Not wired into iOS navigation yet — the Dashboard shows Spark history only
        (see `GET /sparks` below). The Matches tab is marked "Concept — not yet
        built" in the design and intentionally left out of the tab bar.
      responses:
        '200':
          description: Match list
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /matches/simulate:
    post:
      tags: [Matching]
      summary: Simulate compatibility between two users (internal/testing) (implemented)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, other_user_id]
              properties:
                user_id:
                  type: integer
                other_user_id:
                  type: integer
      responses:
        '200':
          description: Compatibility score and breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Spark
  # ---------------------------------------------------------------------------

  /sparks:
    get:
      tags: [Spark]
      summary: List the current user's Spark sessions (needed — not yet implemented)
      description: >
        Powers the Dashboard "YOUR SPARKS" list (compatibility % + date + status
        per session). No `SparksController#index` exists yet — only `create`,
        `join`, `submit_answers`, and `result` are implemented. Deliberately NOT
        `SparkSession`/`SparkSerializer`'s shape — that serializer has no
        `compatibility_score`, which this list needs.
      responses:
        '200':
          description: Spark session list, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  sparks:
                    type: array
                    items:
                      $ref: '#/components/schemas/SparkHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Spark]
      summary: Create a new Spark session (implemented)
      description: >
        Registered users only (the iOS "Start a Spark" QR-generation screen is
        gated behind login — see docs/features/spark-v1.md). Creates a pending
        Spark session with a 6-digit session_code and a qr_token UUID. Only one
        active session per user at a time. Session expires
        (`config/settings/spark.yml` → `expiry_minutes`, default 10) if not joined.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                spark:
                  type: object
                  properties:
                    lat:
                      type: number
                      format: float
                      description: Approximate latitude (optional)
                    lng:
                      type: number
                      format: float
                      description: Approximate longitude (optional)
      responses:
        '201':
          description: Spark session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sparks/join:
    post:
      tags: [Spark]
      summary: Join a Spark session by code or QR token, without knowing its id (implemented)
      description: >
        What the iOS "Scan QR" / "Enter code manually" screen actually calls.
        `POST /sparks/{id}/join` (below) requires the numeric Spark id in the
        path, but a scanning/typing guest never has it — the QR only encodes
        `qr_token`, and a manually-typed `session_code` is 6 digits with no id
        alongside it. This collection-level variant looks the Spark up by
        `session_code`/`qr_token` internally (both are already unique) and
        otherwise behaves exactly like `/sparks/{id}/join`. Requires the joining
        user to already hold a valid access token — see the `/auth/guest`
        anonymous-identity note above for how a brand-new guest gets one before
        ever entering an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spark]
              properties:
                spark:
                  type: object
                  properties:
                    session_code:
                      type: string
                      example: "834920"
                    qr_token:
                      type: string
                      format: uuid
      responses:
        '200':
          description: Session joined — status is now active. Response includes `id` for subsequent submit_answers/result calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            Validation failed, `cannot_join_own_spark`, `spark_not_joinable`
            (already joined/expired), or `invalid_code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sparks/{id}/join:
    post:
      tags: [Spark]
      summary: Join an existing Spark session by id (implemented)
      description: >
        Requires already knowing the numeric Spark id — realistic for
        server-to-server/testing use, not for the QR-scan/manual-code UX (see
        `POST /sparks/join` above, which is what the iOS app calls). Sets
        partner_id and transitions status to active.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spark]
              properties:
                spark:
                  type: object
                  properties:
                    session_code:
                      type: string
                      example: "834920"
                    qr_token:
                      type: string
                      format: uuid
      responses:
        '200':
          description: Session joined — status is now active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            Validation failed, `cannot_join_own_spark`, `spark_not_joinable`
            (already joined/expired), or `invalid_code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sparks/{id}/submit_answers:
    post:
      tags: [Spark]
      summary: Submit the Spark questionnaire answers (implemented)
      description: >
        Each participant submits their answers independently, right after
        scanning/creating the session and before the result is available.
        When both sides have submitted, `SparkScoringJob` is enqueued
        automatically (Solid Queue, spark queue).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spark]
              properties:
                spark:
                  type: object
                  required: [answers]
                  properties:
                    answers:
                      type: array
                      items:
                        type: integer
                      description: >
                        Encoded answer indices for the 5-question set, in the same
                        order as docs/features/signals-v1.md § Questionnaire.
      responses:
        '200':
          description: Answers stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, active, completed, expired]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation failed, or `session_not_active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sparks/{id}/result:
    get:
      tags: [Spark]
      summary: Get Spark session result (implemented)
      description: >
        Returns the compatibility score once both participants have submitted
        answers and `SparkScoringJob` has run. `dimensions` is `{}` if either
        participant has no health summary (score falls back to declared
        preferences only, per docs/features/spark-v1.md § UC-05).
        TrustScore and spark_verified updates are planned for a later phase
        (Trust, ref: docs/features/trust-v1.md) and are not part of this
        response yet. Match creation/reward issuance happens as a side effect
        the first time this is called after completion; poll with backoff if
        the spark isn't `completed` yet — there is no push/WebSocket event for
        this in the current implementation (`docs/conventions/ios.md` describes
        an Action Cable `spark:scored` event as the target design; it is not
        wired up server-side yet).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Result ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a participant in this Spark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Spark not completed yet — retry in a few seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /spark_rewards:
    get:
      tags: [Spark]
      summary: List rewards for the current user (implemented)
      responses:
        '200':
          description: Reward list
          content:
            application/json:
              schema:
                type: object
                properties:
                  rewards:
                    type: array
                    items:
                      $ref: '#/components/schemas/SparkReward'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Date Proposals — Phase 1 (Moments). Not implemented; see docs/features/moments-v1.md.
  # No backend model, controller, or route exists for this yet. Kept here only as
  # the forward-looking contract for when Moments is built.
  # ---------------------------------------------------------------------------

  /date_proposals:
    get:
      tags: [DateProposals]
      summary: List date proposals for current user (needed — Phase 1, not implemented)
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  date_proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/DateProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [DateProposals]
      summary: Create a new date proposal (needed — Phase 1, not implemented)
      description: References a Match (via match_id) rather than raw user IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date_proposal]
              properties:
                date_proposal:
                  type: object
                  required: [match_id, suggested_time_slot]
                  properties:
                    match_id:
                      type: integer
                      description: ID of the Match between the participants
                    suggested_time_slot:
                      type: string
                      format: date-time
                    venue_note:
                      type: string
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /date_proposals/{id}/accept:
    post:
      tags: [DateProposals]
      summary: Accept a date proposal (needed — Phase 1, not implemented)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Proposal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /date_proposals/{id}/decline:
    post:
      tags: [DateProposals]
      summary: Decline a date proposal (needed — Phase 1, not implemented)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Proposal declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# =============================================================================
# Components
# =============================================================================

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token obtained from POST /auth/login, /auth/register, or
        /auth/guest. Pass as: Authorization: Bearer <access_token>

  responses:
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_token:
              value:
                error:
                  code: "invalid_token"
                  message: "Token is invalid or expired"
            invalid_credentials:
              value:
                error:
                  code: "invalid_credentials"
                  message: "Email or password is incorrect"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_failed:
              value:
                error:
                  code: "validation_failed"
                  message: "Email has already been taken"
                  field: "email"

  schemas:

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    UserSignup:
      type: object
      required: [auth_provider]
      properties:
        email:
          type: string
          format: email
          nullable: true
          example: "user@example.com"
        phone:
          type: string
          example: "+79001234567"
          nullable: true
        password:
          type: string
          nullable: true
          description: Required when auth_provider is 0 (email)
        auth_provider:
          type: integer
          enum: [0, 1, 2, 3]
          description: >
            0 = email, 1 = apple, 2 = google, 3 = telegram
          example: 0
        provider_uid:
          type: string
          nullable: true
          description: Provider-specific user identifier (Apple/Google/Telegram)

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: >
            Short-lived JWT (see config/settings/auth.yml's access_token_ttl,
            1 hour by default) — use for all authenticated requests
        refresh_token:
          type: string
          description: Long-lived token (30 days) — use only for POST /auth/refresh
        user:
          $ref: '#/components/schemas/UserBase'

    GuestAuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Seconds until access_token expiry
        account_type:
          type: string
          enum: [guest, active]

    # -------------------------------------------------------------------------
    # User & Profile
    # -------------------------------------------------------------------------

    UserBase:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        auth_provider:
          type: string
          enum: [email, apple, google, telegram]

    Profile:
      type: object
      properties:
        display_name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        photo_url_main:
          type: string
          format: uri
          nullable: true
        photo_urls:
          type: array
          items:
            type: string
            format: uri
        trust_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        spark_verified:
          type: boolean

    MeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserBase'
        profile:
          $ref: '#/components/schemas/Profile'
          nullable: true
          description: null until the user has a profiles row (e.g. before activation)
        health_summary:
          $ref: '#/components/schemas/HealthSummary'
          nullable: true

    # -------------------------------------------------------------------------
    # Health
    # -------------------------------------------------------------------------

    HealthSummaryInput:
      type: object
      required: [effective_from]
      properties:
        effective_from:
          type: string
          format: date
          description: Send today's date — the client aggregates a rolling window ending today.
        effective_to:
          type: string
          format: date
          nullable: true
        chronotype:
          type: string
          enum: [early_bird, intermediate, night_owl]
        sleep_start_local:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "23:30"
          description: Average sleep onset (local time HH:mm)
        sleep_end_local:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "07:15"
          description: Average wake time (local time HH:mm)
        avg_sleep_duration_minutes:
          type: integer
          example: 460
        routine_stability_index:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Variance-based regularity score (0 = chaotic, 1 = perfectly regular)
        activity_level:
          type: string
          enum: [low, medium, high]
        peak_energy_start_local:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "10:00"
        peak_energy_end_local:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "13:00"
        recovery_score:
          type: string
          enum: [low, medium, high]
        source:
          type: string
          enum: [apple_health, health_connect]
        avg_daily_steps:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented. No column on `health_summaries` yet;
            see docs/product/decisions.md#signals-steps-resting-hr-in-summary.
        avg_resting_heart_rate_bpm:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented. No column on `health_summaries` yet;
            see docs/product/decisions.md#signals-steps-resting-hr-in-summary.
            Distinct from the existing `recovery_score` enum above (low/medium/high) —
            this is the raw bpm number.

    HealthSummary:
      allOf:
        - $ref: '#/components/schemas/HealthSummaryInput'

    SignalsSummary:
      type: object
      description: Human-readable, derived-at-request-time — no additional DB row.
      properties:
        chronotype_label:
          type: string
          example: "Night owl"
        peak_energy_window:
          type: string
          nullable: true
          example: "21:00–23:00"
        routine_stability_tier:
          type: string
          nullable: true
          example: "High"
        activity_tier:
          type: string
          nullable: true
          enum: [low, medium, high]
        avg_sleep_duration_minutes:
          type: integer
          nullable: true
        avg_daily_steps:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented (depends on the `health_summaries`
            column of the same name). See
            docs/product/decisions.md#signals-steps-resting-hr-in-summary.
        avg_resting_heart_rate_bpm:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented. See
            docs/product/decisions.md#signals-steps-resting-hr-in-summary.
        self_report_alignment:
          type: object
          properties:
            aligned:
              type: boolean
              nullable: true
              description: null when the user has not declared a self-reported chronotype
            note:
              type: string
              nullable: true
              example: "You told us you're a morning person — your data says otherwise. No judgment, just noting it."

    # -------------------------------------------------------------------------
    # Preferences (declared preferences / Spark questionnaire)
    # -------------------------------------------------------------------------

    PreferenceProfileInput:
      type: object
      description: One key per question in docs/features/signals-v1.md § Questionnaire.
      properties:
        sleep_together_importance:
          type: integer
          minimum: 1
          maximum: 5
          description: "Q1 — Is it important to fall asleep at the same time as your partner?"
        temperature_preference:
          type: string
          enum: [cool, warm, no_preference]
          description: "Q2 — Cool or warm sleeping environment?"
        movement_preference:
          type: string
          enum: [very_little, moderate, a_lot, as_much_as_possible]
          description: "Q3 — How much daily movement feels right?"
        rhythm_importance:
          type: integer
          minimum: 1
          maximum: 5
          description: "Q4 — Importance that people close to you share your daily rhythm"
        self_chronotype:
          type: string
          enum: [morning, night, depends]
          description: "Q5 — Morning person, night person, or depends?"

    PreferenceProfile:
      allOf:
        - $ref: '#/components/schemas/PreferenceProfileInput'

    # -------------------------------------------------------------------------
    # Matching
    # -------------------------------------------------------------------------

    MatchParticipant:
      type: object
      properties:
        user_id:
          type: integer
        role:
          type: string
          enum: [initiator, member]
        profile:
          type: object
          nullable: true
          properties:
            display_name:
              type: string

    Match:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [proposed, accepted, rejected]
        compatibility_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        accepted_at:
          type: string
          format: date-time
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MatchParticipant'

    CompatibilityResult:
      type: object
      properties:
        compatibility_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        dimensions:
          type: object
          properties:
            sleep_rhythm:
              type: number
              format: float
              description: Weight 35%
            energy_overlap:
              type: number
              format: float
              description: Weight 30%
            lifestyle:
              type: number
              format: float
              description: Weight 20% (routine_stability_index only in Step 1.0)

    # -------------------------------------------------------------------------
    # Spark
    # -------------------------------------------------------------------------

    SparkSession:
      type: object
      properties:
        id:
          type: integer
        session_code:
          type: string
          example: "834920"
        qr_token:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, completed, expired]
        started_at:
          type: string
          format: date-time
          nullable: true
        location_lat:
          type: number
          format: float
          nullable: true
        location_lng:
          type: number
          format: float
          nullable: true

    SparkHistoryEntry:
      type: object
      description: "`GET /sparks` row — see the note on that operation."
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, active, completed, expired]
        compatibility_score:
          type: number
          format: float
          nullable: true
          description: null until status is completed
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    SparkResult:
      type: object
      properties:
        compatibility_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        dimensions:
          type: object
          additionalProperties:
            type: number
            format: float
          description: "{} when either participant has no health summary yet"
          example:
            sleep_rhythm: 90
            energy_overlap: 85
            lifestyle: 78
        rewards:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [premium_week, match_credit, boost]
              status:
                type: string
                enum: [pending, redeemed, expired]
        your_avg_heart_rate:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented. No column on `sparks` yet, and no
            submission path — see
            docs/product/decisions.md#spark-heart-rate-during-session.
            Resolved server-side to the requester's own perspective (same as
            `compatibility_score`) since `SparkSerializer` exposes neither
            `initiator_id` nor `partner_id` for the client to disambiguate itself.
        partner_avg_heart_rate:
          type: integer
          nullable: true
          description: >
            Needed — not yet implemented. See
            docs/product/decisions.md#spark-heart-rate-during-session.

    SparkReward:
      type: object
      properties:
        id:
          type: integer
        reward_type:
          type: string
          enum: [premium_week, match_credit, boost]
          description: >
            premium_week: free users get 7 days premium;
            match_credit: premium users get a match credit;
            boost: premium+ users get credit + boost
        status:
          type: string
          enum: [pending, redeemed, expired]
        valid_until:
          type: string
          format: date-time
          nullable: true

    # -------------------------------------------------------------------------
    # Date Proposals (Phase 1 — not implemented)
    # -------------------------------------------------------------------------

    DateProposal:
      type: object
      properties:
        id:
          type: integer
        match_id:
          type: integer
          description: References the Match between participants (not raw user IDs)
        suggested_time_slot:
          type: string
          format: date-time
        venue_note:
          type: string
          nullable: true
        status:
          type: string
          enum: [suggested, accepted, declined, completed]
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Errors
    # -------------------------------------------------------------------------

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: "Email has already been taken"
            field:
              type: string
              nullable: true
              example: email
