# Append-only. New decisions go at the bottom.
# Format: id (snake_case), date (YYYY-MM), decision, reason.
# If reversing a prior decision, add a new entry referencing the old id — do NOT edit the old one.

decisions:
  - id: no_devise
    date: 2025-01
    decision: No Devise — auth via has_secure_password + jwt gem
    reason: |
      Devise adds view helpers, route macros, and session logic irrelevant to an API-only app.
      JWT access + refresh tokens are sufficient for iOS/Android clients.
    implementation: |
      User.has_secure_password(validations: false) — password validation is opt-in per auth_provider.
      JwtService.access_token(user) / JwtService.refresh_token(user) handle token issuance.
      Token verification in ApplicationController before_action :authenticate_user!.

  - id: no_redis
    date: 2025-01
    decision: No Redis — SolidCache + SolidQueue + SolidCable on PostgreSQL
    reason: |
      Eliminates a runtime dependency. PostgreSQL already required;
      Solid* gems provide equivalent functionality with fewer moving parts in production.
    implementation: |
      Background jobs: SolidQueue (class inherits ApplicationJob < ActiveJob::Base).
      Cable: SolidCable adapter in cable.yml.
      Caching: SolidCache adapter in environments/production.rb.

  - id: no_rspec
    date: 2025-01
    decision: Minitest over RSpec
    reason: Ships with Rails, zero configuration, faster boot. SimpleCov threshold enforced at 90%.

  - id: fk_to_users
    date: 2025-01
    decision: All FK columns point to users.id, never profiles.id
    reason: |
      User is the identity root. Profile is a dependent child that can be nil.
      Referencing profiles.id would create a hard dependency on profile existence.

  - id: soft_delete
    date: 2025-01
    decision: Soft delete (deleted_at) on all primary domain tables, no hard deletes
    reason: Preserves audit trail and enables recovery. Hard deletes on UGC are irreversible.
    implementation_status: NOT YET IMPLEMENTED IN DB.
      No table has deleted_at as of schema version 2026_05_27_000008.
      When this is implemented, each table gets:
        - deleted_at datetime nullable indexed
        - default_scope -> { where(deleted_at: nil) }
      Do NOT generate deleted_at columns on existing tables unless the issue explicitly targets this.

  - id: migration_policy
    date: 2025-01
    decision: All migrations must be reversible and zero-downtime safe
    reason: Production is a live mobile app; locking tables is not acceptable.
    rules:
      - Every migration must have a def down (or be reversible via change with reversible operations only)
      - Adding columns: always nullable OR with a default — never NOT NULL without default on existing table
      - Adding indexes: use algorithm: :concurrently to avoid table locks
      - Renaming columns: forbidden in a single migration; use add+copy+drop across 3 deploys
      - Dropping columns: must be ignored at model level (self.ignored_columns) before the migration runs
    example_index: |
      add_index :spark_sessions, :status, algorithm: :concurrently

  - id: alba_serializer
    date: 2026-07
    decision: Alba for JSON serialization; serializers in app/serializers/
    reason: |
      Fastest plain-Ruby serializer, zero magic, integrates cleanly with dry-struct output objects.
      Replaces ad-hoc inline hashes in controllers.
    implementation: |
      class UserSerializer
        include Alba::Resource
        attributes :id, :email, :auth_provider
        one :profile, resource: ProfileSerializer
      end
      Render: render json: UserSerializer.new(@user).serialize
      Render collection: render json: UserSerializer.new(@users).serialize

  - id: dry_validation
    date: 2026-07
    decision: dry-validation + dry-struct + dry-types for input contracts
    reason: |
      Moves input validation out of controllers into typed contracts.
      Eliminates params.require/permit fragmentation.
      dry-struct provides typed value objects as contract output.
    implementation: |
      contracts/ in app/contracts/; one file per operation (e.g. CreateSparkSessionContract).
      Controller calls contract.call(params), checks result.success?, then passes
      result.to_h to the service. Never pass raw params to a service.
      On failure: render json: { errors: result.errors.to_h }, status: :unprocessable_entity

  - id: interactor_service_pattern
    date: 2025-01
    decision: Service objects via interactor gem, entry point always .call
    reason: Consistent interface across all services. Result objects use Data.define for immutable typed returns.
    implementation: |
      class SomeService
        include Interactor
        def call
          context.result = Data.define(:field).new(field: value)
        rescue SomeError => e
          context.fail!(error: e.message)
        end
      end
      Caller: outcome = SomeService.call(arg: value)
              outcome.success? / outcome.failure? / outcome.result / outcome.error

  - id: pundit_authorization
    date: 2025-01
    decision: Pundit for resource-level authorization
    reason: Lightweight, explicit policy objects. Users can only modify their own resources.
    implementation: |
      Policies in app/policies/; base ApplicationPolicy enforces current_user ownership.
      Controller: authorize @resource before any write action.
      Test: assert 403 when user acts on another user's resource.

  - id: yandex_storage
    date: 2025-01
    decision: Yandex Object Storage as primary S3-compatible backend for RU region
    reason: Data residency requirements. aws-sdk-s3 with custom endpoint allows drop-in swap to AWS S3.
    implementation: |
      ActiveStorage configured with service: yandex in storage.yml.
      Custom endpoint: https://storage.yandexcloud.net
      Bucket naming: synca-{env} (synca-production, synca-staging).

  - id: dry_monads_over_interactor
    date: 2026-07
    decision: Replace interactor with dry-monads for service result types
    reason: |
      interactor was never actually used in practice — all services already used self.call
      with plain Data.define or direct returns. dry-monads provides explicit Success/Failure
      values with Ruby 3+ pattern matching (case/in) in controllers, replacing implicit
      outcome.failure? boolean checks. Keeps the entire validation+service layer within
      the dry-rb family (dry-types, dry-validation, dry-struct, dry-monads).
    implementation: |
      Remove interactor from Gemfile. Add dry-monads.
      New services: include Dry::Monads[:result], return Success(value) or Failure([:code, message]).
      Controllers: include Dry::Monads[:result], use case/in pattern matching on service result.
      Pure calculation or side-effect services (CompatibilityService, RewardEngine) keep their
      existing return types — do NOT wrap in Success/Failure unless they have failure paths.
      Minitest assertions use assert_pattern { result => Success } instead of result.success?.
    supersedes: interactor_service_pattern
