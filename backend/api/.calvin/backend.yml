version: 1
stack: rails-api
soft_delete:
  field: deleted_at
  default_scope: true
services:
  call: instance
  path: app/services
controllers:
  namespace: Api::V1
  error_keys: [code, message]
jobs:
  queue: solid_queue
security:
  jwt_type_field: type
  access: access
  refresh: refresh
enums:
  spark_session: [pending, active, completed, expired]
