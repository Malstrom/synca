# Calvin issue templates for Synca backend
# Defines how backend issues should be structured.

version: 1

naming:
  feature_prefix: "feat(backend):"
  bug_prefix: "bug(backend):"
  debt_prefix: "debt(backend):"

sections:
  - user_story
  - tasks
  - tdd
  - references
  - depends_on
  - commit_message

user_story:
  required: true
  format: |
    ## User Story
    US-XX — short description
    → See [docs/product/phases/phase-X.md § US-XX](...)

tasks:
  required: true
  format: bullet_list

tdd:
  required: true
  format: bullet_list

references:
  required: true
  format: bullet_list

commit_message:
  required: true
  pattern: "{prefix}: {short-description}"

