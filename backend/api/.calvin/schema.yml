users:
  table: users
  pk: id (bigserial)
  columns:
    email:          string, unique (partial: where email IS NOT NULL)
    phone:          string, unique (partial: where phone IS NOT NULL)
    auth_provider:  integer enum, default: 0, NOT NULL
    provider_uid:   string, nullable — present for OAuth providers
    password_digest: string, nullable — present only when auth_provider = email
    created_at:     datetime, NOT NULL
    updated_at:     datetime, NOT NULL
  enums:
    auth_provider: { email: 0, apple: 1, google: 2 }   # inferred from provider usage
  indexes:
    - [auth_provider, provider_uid] UNIQUE where provider_uid IS NOT NULL
    - [email] UNIQUE where email IS NOT NULL
    - [phone] UNIQUE where phone IS NOT NULL
  associations:
    has_one:  profile, preference_profile
    has_many: health_summaries, spark_sessions (as initiator + partner),
              spark_rewards, match_participants → matches
  notes:
    - Identity root. Every other table FK targets users.id.
    - No deleted_at — users are not soft-deleted at this layer.
    - email OR phone must be present (enforced at model/contract level, not DB constraint).
    - provider_uid + auth_provider form a compound unique identity for OAuth.

