# Calvin logical schema for Synca backend (Rails API)
# Skeleton to be refined from db/schema.rb and docs/features/*.

version: 1

models:
  User:
    table: users
    fields:
      - email
      - phone
      - auth_provider
      - provider_uid
      - password_digest
    relations:
      - has_one: Profile
      - has_one: PreferenceProfile
      - has_many: SparkSessions
      - has_many: SparkRewards
      - has_many: HealthSummaries

  Profile:
    table: profiles
    fields:
      - display_name
      - birth_date
      - gender
      - city
    relations:
      - belongs_to: User

  HealthSummary:
    table: health_summaries
    fields:
      - chronotype
      - activity_level
      - routine_stability_index
      - avg_sleep_duration_minutes
    relations:
      - belongs_to: User

  SparkSession:
    table: spark_sessions
    fields:
      - initiator_id
      - partner_id
      - status
      - session_code
      - qr_token
      - started_at
      - completed_at
      - compatibility_score
    relations:
      - belongs_to: Initiator (User)
      - belongs_to: Partner (User)
      - has_many: SparkRewards

  SparkReward:
    table: spark_rewards
    fields:
      - user_id
      - spark_session_id
      - reward_type
      - status
      - valid_until
    relations:
      - belongs_to: User
      - belongs_to: SparkSession

  Match:
    table: matches
    fields:
      - compatibility_score
      - status
      - accepted_at
      - rejected_at
    relations:
      - has_many: MatchParticipants
      - has_many: Users through MatchParticipants
