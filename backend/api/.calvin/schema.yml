# ─────────────────────────────────────────
# WORKING RULES FOR THE MODEL
# ─────────────────────────────────────────

working_rules:
  - Never use profiles.id as a FK target. Always traverse via user_id.
  - To get a user's profile: User.find(id).profile  (not Profile.find)
  - To get a user's matches: use match_participants join, never add user_id to matches.
  - health_summaries current record: where(effective_to: nil).order(effective_from: :desc).first
  - Soft delete: NOT present in this schema version. Models use status enums + timestamps instead.
  - Enums are integer-backed in DB. In Rails models they map to symbols via enum declarations.
  - jsonb fields (photo_urls, visual_embedding, music_profile, initiator_answers, partner_answers)
    are always validated at contract layer (dry-validation) before write.
  - session_code and qr_token are generated server-side (SecureRandom); never client-supplied.
