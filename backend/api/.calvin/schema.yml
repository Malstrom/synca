# ─────────────────────────────────────────
# HEALTH & BIOMETRIC DATA
# ─────────────────────────────────────────

health_summaries:
  table: health_summaries
  pk: id (bigserial)
  fk: user_id → users.id
  columns:
    user_id:                  bigint, NOT NULL
    chronotype:               integer enum, NOT NULL
    sleep_start_local:        time, nullable — local timezone wall clock
    sleep_end_local:          time, nullable
    avg_sleep_duration_minutes: integer, nullable
    routine_stability_index:  float, nullable — 0.0–1.0, higher = more consistent
    activity_level:           integer enum, nullable
    peak_energy_start_local:  time, nullable
    peak_energy_end_local:    time, nullable
    recovery_score:           integer, nullable — 0–100
    source:                   integer enum, NOT NULL
    effective_from:           date, NOT NULL
    effective_to:             date, nullable — NULL = currently active record
    created_at:               datetime, NOT NULL
    updated_at:               datetime, NOT NULL
  enums:
    chronotype:     { morning: 0, intermediate: 1, evening: 2 }
    activity_level: { sedentary: 0, light: 1, moderate: 2, active: 3, very_active: 4 }
    source:         { apple_health: 0, google_fit: 1, manual: 2 }
  indexes:
    - [user_id, effective_from]
    - [user_id]
  notes:
    - Versioned records via effective_from/effective_to (SCD Type 2 pattern).
    - Current active record: effective_to IS NULL.
    - One active record per user per source at any time.
    - Populated by HealthKit sync job on iOS; used by MatchScoringFacade for chronotype compatibility.

# ─────────────────────────────────────────
# SPARK SESSION (IRL meeting flow)
# ─────────────────────────────────────────

spark_sessions:
  table: spark_sessions
  pk: id (bigserial)
  fk:
    initiator_id → users.id
    partner_id   → users.id (nullable — NULL until partner scans QR)
  columns:
    initiator_id:            bigint, NOT NULL
    partner_id:              bigint, nullable
    status:                  integer enum, default: 0, NOT NULL
    session_code:            string, NOT NULL, UNIQUE
    qr_token:                string, NOT NULL, UNIQUE
    location_lat:            float, nullable
    location_lng:            float, nullable
    started_at:              datetime, nullable
    completed_at:            datetime, nullable
    initiator_answers:       jsonb, nullable — questionnaire responses
    partner_answers:         jsonb, nullable
    compatibility_score:     float, nullable — computed after both answer
    reward_issued_initiator: boolean, default: false, NOT NULL
    reward_issued_partner:   boolean, default: false, NOT NULL
    created_at:              datetime, NOT NULL
    updated_at:              datetime, NOT NULL
  enums:
    status: { pending: 0, active: 1, completed: 2, expired: 3, declined: 4 }
  indexes:
    - [initiator_id]
    - [partner_id]
    - [session_code] UNIQUE
    - [qr_token] UNIQUE
    - [status]
  associations:
    belongs_to: initiator (User), partner (User, optional)
    has_many:   spark_rewards
  notes:
    - Flow: initiator creates session (status: pending) → generates QR → partner scans
      qr_token → status: active → both answer questionnaire → compatibility_score computed
      via MatchScoringFacade → status: completed → rewards issued.
    - Spark is blocked if initiator has no connected Apple Health (iOS MVP gate).
    - reward_issued_* flags prevent double-granting; set atomically with SparkReward creation.
    - location_lat/lng captured at session start for proximity context.

