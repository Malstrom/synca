spark_rewards:
  table: spark_rewards
  pk: id (bigserial)
  fk:
    user_id          → users.id
    spark_session_id → spark_sessions.id
  columns:
    user_id:          bigint, NOT NULL
    spark_session_id: bigint, NOT NULL
    reward_type:      integer enum, NOT NULL
    status:           integer enum, default: 0, NOT NULL
    valid_until:      datetime, NOT NULL
    created_at:       datetime, NOT NULL
    updated_at:       datetime, NOT NULL
  enums:
    reward_type: { boost: 0, extended_match: 1, super_spark: 2 }   # inferred
    status:      { active: 0, used: 1, expired: 2 }
  indexes:
    - [spark_session_id]
    - [user_id, status]
    - [user_id]
  notes:
    - One reward record per participant per completed SparkSession.
    - valid_until enforces time-limited rewards; expiry checked at consumption.
    - Guard against double-issue: spark_sessions.reward_issued_* checked before creation.

# ─────────────────────────────────────────
# MATCHES (post-Spark match graph)
# ─────────────────────────────────────────

matches:
  table: matches
  pk: id (bigserial)
  columns:
    compatibility_score: float, NOT NULL — copied from spark_session at match creation
    status:              integer enum, default: 0, NOT NULL
    accepted_at:         datetime, nullable
    rejected_at:         datetime, nullable
    created_at:          datetime, NOT NULL
    updated_at:          datetime, NOT NULL
  enums:
    status: { pending: 0, active: 1, rejected: 2, unmatched: 3, blocked: 4 }
  associations:
    has_many: match_participants, messages (future)
  notes:
    - matches has NO direct user_id FK — user association is always via match_participants.
    - To find a user's matches: JOIN match_participants ON match_id WHERE user_id = ?
    - accepted_at/rejected_at record decision timestamps for analytics.

match_participants:
  table: match_participants
  pk: id (bigserial)
  fk:
    match_id → matches.id
    user_id  → users.id
  columns:
    match_id:   bigint, NOT NULL
    user_id:    bigint, NOT NULL
    role:       integer enum, default: 0, NOT NULL
    created_at: datetime, NOT NULL
    updated_at: datetime, NOT NULL
  enums:
    role: { participant: 0, initiator: 1 }
  indexes:
    - [match_id, user_id] UNIQUE
    - [match_id]
    - [user_id]
  notes:
    - Join table between matches and users. Always 2 rows per match.
    - UNIQUE constraint on (match_id, user_id) prevents duplicate participants.
    - Query pattern for "user's active matches":
        Match.joins(:match_participants)
             .where(match_participants: { user_id: current_user.id })
             .where(status: :active)

