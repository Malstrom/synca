ruby: "3.3.1"
framework: "Rails 8.0.3 (API-only)"
server: "Puma + Thruster"
deploy: "Kamal + Docker"

database:
  primary: PostgreSQL
  cache: SolidCache
  queue: SolidQueue
  cable: SolidCable

storage: "aws-sdk-s3 (Yandex Object Storage / AWS S3)"

auth:
  password: "bcrypt + has_secure_password"
  tokens: "jwt ~> 3.2 — access + refresh"
  note: no Devise

api:
  cors: rack-cors
  pagination: pagy
  serializer: "Alba — app/serializers/"

input_validation:
  gems:
    - dry-types
    - dry-validation
    - dry-struct
  contracts_location: app/contracts/

authorization: pundit
service_objects: interactor
monitoring: "sentry-ruby + sentry-rails (GlitchTip, no-op without SENTRY_DSN)"

testing:
  framework: Minitest
  factories: factory_bot_rails
  fakes: faker
  coverage: "simplecov >= 90%"
  db_cleaner: database_cleaner-active_record
  http_mock: webmock

dev_tools:
  linter: rubocop-rails-omakase
  security: brakeman + bundler-audit
  schema_comments: annotate
  api_docs: scalar_ruby

ci_command: bin/rails ci
