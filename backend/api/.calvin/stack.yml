ruby: "3.3.1"
framework: "Rails 8.0.3 (API-only)"
server: "Puma + Thruster"
deploy: "Kamal 2 + Docker"

database:
  primary: PostgreSQL
  cache: SolidCache  # replaces Redis for caching
  queue: SolidQueue  # replaces Sidekiq; jobs inherit ApplicationJob < ActiveJob::Base
  cable: SolidCable  # replaces Redis pub/sub for Action Cable

storage: "aws-sdk-s3 (no pinned version) — Yandex Object Storage for RU, drop-in to AWS S3 for other regions"

rails_8_features_in_use:
  - SolidCache / SolidQueue / SolidCable (native, no Redis)
  - ActiveRecord::Schema[8.0] (schema version format)
  - has_secure_password with validations: false (opt-in per auth_provider)
  - Native async queries (load_async where applicable)

auth:
  password: "bcrypt ~> 3.1.7 + has_secure_password"
  tokens: "jwt ~> 3.2 — access + refresh; issued by JwtService"
  providers:
    email:    0  # password_digest required
    apple:    1  # provider_uid required, no password_digest
    google:   2  # provider_uid required, no password_digest
    telegram: 3  # provider_uid required, no password_digest — no production flow yet, do NOT generate controllers
  note: no Devise

api:
  cors: rack-cors (no pinned version)
  pagination: pagy (no pinned version) — default 20, max 100
  serializer: "alba (no pinned version) — serializers in app/serializers/"

input_validation:
  gems:
    dry-types:      no pinned version
    dry-validation: no pinned version
    dry-struct:     no pinned version
  contracts_location: app/contracts/

authorization:
  gem: pundit (no pinned version)
  policies_location: app/policies/

service_objects:
  gem: interactor (no pinned version)
  pattern: "self.call → Result = Data.define(...)"

monitoring:
  gems: "sentry-ruby + sentry-rails (no pinned version)"
  backend: "GlitchTip (Sentry-compatible)"
  activation: "no-op without SENTRY_DSN env var"

storage_processing:
  gem: "image_processing ~> 1.2"
  use: profile photo variants via ActiveStorage

testing:
  framework: Minitest
  coverage: "simplecov (no pinned version) — threshold 90%"
  factories: factory_bot_rails (no pinned version)
  fakes: faker (no pinned version)
  db_cleaner: database_cleaner-active_record (no pinned version)
  http_mock: webmock (no pinned version)
  note: fixtures are primary — FactoryBot for complex trait composition only

dev_tools:
  linter: rubocop-rails-omakase (no pinned version)
  security: "brakeman + bundler-audit (no pinned version)"
  schema_comments: annotate (no pinned version)
  api_docs: "scalar_ruby (no pinned version) — development only"

ci_command: bin/rails ci
note_on_versions: |
  Most gems have no pinned version in Gemfile (alba, interactor, pundit, pagy, dry-*, etc.).
  Do NOT invent version constraints when generating code. Use the gem API as documented
  in the canonical patterns in conventions.yml.
