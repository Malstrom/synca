approach: TDD — red → green → refactor
framework: Minitest
fixtures: true (no FactoryBot in MVP)
coverage:
  tool: SimpleCov
  threshold: 90% line coverage — build fails below
forbidden:
  - require "minitest/mock" — breaks Bootsnap on Ruby 3.3
  - test files in app/ — Zeitwerk conflict
stub_pattern: define_singleton_method on instance (not .stub on class)
always_test:
  models: validations, scopes, enums, custom methods
  services: core logic, DB side-effects, error handling
  controllers: HTTP status, JSON structure, auth enforcement (401 on missing/invalid token)
  jobs: happy path, graceful skip on missing data, side-effect records
  channels: subscription accepted for authorized, rejected for non-members
command: bin/rails ci
