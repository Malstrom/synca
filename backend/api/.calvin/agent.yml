# Calvin agent config for Synca backend (Rails API)
# This file tells Calvin where to find conventions, schema, and issue templates.

version: 1
name: synca-backend
stack: rails-api

sources:
  backend_conventions: backend/api/.calvin/backend.yml
  schema: backend/api/.calvin/schema.yml
  issues: backend/api/.calvin/issues.yml

rules:
  - use: backend_conventions
  - use: schema
  - use: issues

