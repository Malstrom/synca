naming:
  files: snake_case
  methods: snake_case
  classes: CamelCase
  constants: SCREAMING_SNAKE_CASE
  database_columns: snake_case
  boolean_columns: "suffix _verified or _at (e.g. spark_verified, deleted_at)"

folder_structure:
  controllers: app/controllers/api/v1/
  services: app/services/
  serializers: app/serializers/
  contracts: app/contracts/
  jobs: app/jobs/
  channels: app/channels/
  models: app/models/
  tests: test/

api_response:
  concern: ApiResponse included in ApplicationController
  helpers:
    - render_success(data, status: :ok)
    - render_created(data)
    - render_error(code:, message:, field:)
    - render_unauthorized
    - render_not_found(resource)
    - render_validation_errors(record)
    - auth_response(user)
  rules:
    - success payloads use the resource name as key, never a {data:} wrapper
    - error codes are snake_case strings (e.g. validation_failed, not_found)
    - field: in errors identifies the offending parameter

controllers:
  - all under Api::V1, mounted at /api/v1/
  - authentication via before_action :authenticate_user! in ApplicationController
  - no inline response hashes — delegate to Alba serializer
  - input validation via dry-validation contract, not params.require/permit
  - public methods map to standard REST actions only
  - business logic delegated to service objects or interactors, never inline

serializers:
  location: app/serializers/
  naming: ResourceSerializer (e.g. UserSerializer, MatchSerializer)
  usage: "render_success UserSerializer.new(resource).serialize"
  rules:
    - one serializer per resource, not per endpoint
    - nested associations use dedicated serializers
    - no inline hashes in controllers

contracts:
  location: app/contracts/
  naming: ResourceContract (e.g. HealthSummaryContract, RegistrationContract)
  usage: |
    result = HealthSummaryContract.new.call(params.to_unsafe_h)
    return render_contract_errors(result) if result.failure?
  rules:
    - contract output typed via dry-struct
    - params.require/permit not used in controllers that have a contract
    - contract errors mapped to {error: {code, message, field}}

service_objects:
  pattern: "ServiceName.call(args) — always .call as entry point"
  result_object: "Data.define(:field1, :field2) — see CompatibilityService::Result"
  location: app/services/
  rules:
    - stateful services use initialize + call; stateless use self.call only
    - services never render — always return a Result object
    - weights and thresholds defined as constants in the service or in docs/, never in controllers

models:
  - all inherit from ApplicationRecord
  - all files have # frozen_string_literal: true
  - all FK columns point to users.id — never profiles.id
  - soft delete on all primary domain tables (deleted_at) — no hard deletes
  - enums use modern syntax: enum :field, { value: integer }
  - before_save callbacks handle normalization (e.g. normalize_email)
  - custom validations use validate :method_name

patterns:
  - all endpoints under /api/v1/ with Bearer JWT auth
  - pagination: page + per_page params, response includes meta.total_count
  - background jobs call high-level facade, never scoring services directly
  - MlEventLogger called at all interaction points — must never raise
  - external services stubbed in tests via define_singleton_method on instance

do_not_touch:
  - score threshold values — defined only in docs/features/matching-v1.md and docs/features/circles-v1.md
  - profiles.id — never used as FK target
  - MlEventLogger rescue block — must never raise
  - ML_SCORING_ENABLED — defaults false in all envs

style_guide: docs/conventions/backend.md
