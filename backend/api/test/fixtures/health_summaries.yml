early_bird:
  user: with_health_summary
  chronotype: early_bird
  source: apple_health
  effective_from: <%= 1.month.ago %>
  effective_to: null
  sleep_start_local: <%= Time.zone.parse("22:00") %>
  sleep_end_local: <%= Time.zone.parse("06:30") %>
  avg_sleep_duration_minutes: 450
  routine_stability_index: 0.8
  activity_level: medium
  peak_energy_start_local: <%= Time.zone.parse("08:00") %>
  peak_energy_end_local: <%= Time.zone.parse("10:00") %>
  recovery_score: high

night_owl:
  user: with_health_summary
  chronotype: night_owl
  source: apple_health
  effective_from: <%= 1.month.ago %>
  effective_to: null
  sleep_start_local: <%= Time.zone.parse("01:00") %>
  sleep_end_local: <%= Time.zone.parse("09:30") %>
  avg_sleep_duration_minutes: 480
  routine_stability_index: 0.7
  activity_level: high
  peak_energy_start_local: <%= Time.zone.parse("22:00") %>
  peak_energy_end_local: <%= Time.zone.parse("00:00") %>
  recovery_score: medium
