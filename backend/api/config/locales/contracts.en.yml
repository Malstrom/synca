# Contract validation error messages.
#
# Centralizes all dry-validation error strings so tests never assert
# raw framework output. Use I18n.t("contracts.errors.<contract>.<field>.<rule>")
# in test files instead of hardcoded strings.
#
# Example:
#   assert_includes errors.dig(:preferences, :sleep_together_importance),
#     I18n.t("contracts.errors.upsert_preferences.sleep_together_importance.inclusion")

en:
  contracts:
    errors:
      upsert_preferences:
        sleep_together_importance:
          inclusion: "must be between 1 and 5"
        rhythm_importance:
          inclusion: "must be between 1 and 5"
        temperature_preference:
          inclusion: "must be one of: cool, warm, no_preference"
        movement_preference:
          inclusion: "must be one of: very_little, moderate, a_lot, as_much_as_possible"
        self_chronotype:
          inclusion: "must be one of: morning, night, depends"
      registration:
        email:
          format: "must be a valid email address"
          filled: "email is required"
        password:
          min_size: "must be at least 8 characters"
          filled: "password is required"
      guest_registration:
        device_id:
          filled: "device_id is required"
      health_summary:
        effective_from:
          filled: "effective_from is required"
        chronotype:
          inclusion: "must be one of: early_bird, intermediate, night_owl"
        activity_level:
          inclusion: "must be one of: low, medium, high"
        recovery_score:
          inclusion: "must be one of: low, medium, high"
      profile:
        gender:
          inclusion: "must be a valid gender value"
        birth_date:
          format: "must be a valid date"
      join_spark:
        session_code:
          format: "must be a 6-digit code"
