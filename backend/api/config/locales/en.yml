# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # Contract validation error messages.
  # Use I18n.t("contracts.errors.<contract>.<field>.<rule>") in tests
  # to avoid asserting raw dry-validation framework strings.
  contracts:
    errors:
      upsert_preferences:
        sleep_together_importance:
          inclusion: "must be between 1 and 5"
        rhythm_importance:
          inclusion: "must be between 1 and 5"
        temperature_preference:
          inclusion: "must be one of: cool, warm, no_preference"
        movement_preference:
          inclusion: "must be one of: very_little, moderate, a_lot, as_much_as_possible"
        self_chronotype:
          inclusion: "must be one of: morning, night, depends"
      registration:
        email:
          format: "must be a valid email address"
          filled: "email is required"
        password:
          min_size: "must be at least 8 characters"
          filled: "password is required"
      guest_registration:
        device_id:
          filled: "device_id is required"
      health_summary:
        effective_from:
          filled: "effective_from is required"
        chronotype:
          inclusion: "must be one of: early_bird, intermediate, night_owl"
        activity_level:
          inclusion: "must be one of: low, medium, high"
        recovery_score:
          inclusion: "must be one of: low, medium, high"
      profile:
        gender:
          inclusion: "must be a valid gender value"
        birth_date:
          format: "must be a valid date"
      join_spark:
        session_code:
          format: "must be a 6-digit code"
