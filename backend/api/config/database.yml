default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: synca_development

test:
  <<: *default
  database: synca_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  # Solid Cache — dedicated DB for Rails.cache
  #
  # NOTE: `url:` always wins over a sibling `database:` key (Rails merges the
  # URL-derived hash on top), so a shared DATABASE_URL can't be combined with
  # a `database:` override here — every secondary db would silently collapse
  # onto the primary's database. Derive a distinct URL per db instead.
  cache:
    <<: *primary_production
    url: <%= URI(ENV["DATABASE_URL"]).tap { |u| u.path = "/synca_production_cache" }.to_s %>
    migrations_paths: db/cache_migrate

  # Solid Queue — dedicated DB for background jobs
  queue:
    <<: *primary_production
    url: <%= URI(ENV["DATABASE_URL"]).tap { |u| u.path = "/synca_production_queue" }.to_s %>
    migrations_paths: db/queue_migrate

  # Solid Cable — dedicated DB for Action Cable
  cable:
    <<: *primary_production
    url: <%= URI(ENV["DATABASE_URL"]).tap { |u| u.path = "/synca_production_cable" }.to_s %>
    migrations_paths: db/cable_migrate
