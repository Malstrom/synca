default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: synca_development

test:
  <<: *default
  database: synca_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  # Solid Cache — dedicated DB for Rails.cache
  cache:
    <<: *primary_production
    database: synca_production_cache
    migrations_paths: db/cache_migrate

  # Solid Queue — dedicated DB for background jobs
  queue:
    <<: *primary_production
    database: synca_production_queue
    migrations_paths: db/queue_migrate

  # Solid Cable — dedicated DB for Action Cable
  cable:
    <<: *primary_production
    database: synca_production_cable
    migrations_paths: db/cable_migrate
