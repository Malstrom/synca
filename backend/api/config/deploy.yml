# Synca API — Kamal deployment configuration
# Docs: https://kamal-deploy.org

service: synca-api
image: ghcr.io/malstrom/synca-api

servers:
  web:
    - <%= ENV["KAMAL_SERVER_IP"] %>

proxy:
  ssl: true
  host: <%= ENV["KAMAL_SERVER_HOST"] %>   # e.g. api.synca.app
  healthcheck:
    path: /up
    interval: 10
    threshold: 5

registry:
  server: ghcr.io
  username: malstrom
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - POSTGRES_PASSWORD
    # Yandex Object Storage — backups
    - YC_ACCESS_KEY_ID
    - YC_SECRET_ACCESS_KEY
    - YC_BACKUP_BUCKET
    - YC_FOLDER_ID
    # GlitchTip error tracking
    - SENTRY_DSN
    - GLITCHTIP_SECRET_KEY
    - GLITCHTIP_DATABASE_URL
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "synca_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  # PostgreSQL — sidecar, never exposed publicly
  db:
    image: postgres:16
    host: <%= ENV["KAMAL_SERVER_IP"] %>
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: synca
        POSTGRES_DB: synca_production
    directories:
      - synca_db_data:/var/lib/postgresql/data

  # GlitchTip — self-hosted error tracking (Sentry-compatible)
  # Access at http://<server-ip>:8000 — restrict in firewall to your IP only
  glitchtip:
    image: glitchtip/glitchtip:latest
    host: <%= ENV["KAMAL_SERVER_IP"] %>
    port: "127.0.0.1:8000:8000"
    env:
      secret:
        - GLITCHTIP_SECRET_KEY
        - GLITCHTIP_DATABASE_URL
      clear:
        GLITCHTIP_DOMAIN: http://localhost:8000
        DEFAULT_AUTO_FIELD: django.db.models.AutoField
        CELERY_WORKER_AUTOSCALE: "1,3"
        CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    directories:
      - glitchtip_uploads:/code/uploads

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"
  migrate: app exec "bin/rails db:migrate"
  backup:  app exec "bin/rails runner 'DatabaseBackupJob.perform_now'"
