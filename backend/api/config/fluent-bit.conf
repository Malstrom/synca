# Fluent Bit — ships Rails stdout logs to Yandex Cloud Logging
# Used in production only. Runs as a sidecar in the Docker Compose / Kamal setup.
# Docs: https://github.com/yandex-cloud/fluent-bit-plugin-yandex

[SERVICE]
    Flush         5
    Daemon        off
    Log_Level     warn

[INPUT]
    Name          tail
    Path          /var/log/synca/*.log
    Tag           synca.api
    Refresh_Interval 5
    DB            /var/log/fluent-bit.db

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[OUTPUT]
    Name          yc-logging
    Match         synca.*
    resource_type stream
    folder_id     ${YC_FOLDER_ID}
    message_key   log
    level_key     level
    default_level INFO
    authorization iam-key-file:/etc/fluent-bit/yc-key.json
