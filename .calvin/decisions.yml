decisions:
  - date: 2026-05
    id: matching-min-days-signals
    decision: Minimum 7 days of signals required before a user enters the algorithm pool (configurable, default 7)
    rationale: Insufficient data produces unreliable scores; 7 days is the minimum meaningful window.
    source: docs/product/decisions.md

  - date: 2026-05
    id: signals-partial-spark-scoring
    decision: Spark is blocked if Apple Health is not connected (iOS MVP); fallback scoring deferred to future version
    rationale: Compatibility score without health data is not meaningful in MVP.
    source: docs/product/decisions.md

  - date: 2026-05
    id: profile-email-verification-mvp
    decision: Email not required before first Spark (guest mode); magic link verification mandatory after first completed Spark
    rationale: Removes the auth wall from the highest-curiosity moment.
    source: docs/product/decisions.md

  - date: 2026-05
    id: profile-completeness-storage
    decision: completeness_score persisted on profiles, updated via Profile::CompletenessCalculator; nightly reconciliation job ensures consistency
    rationale: Avoids per-request recomputation.
    source: docs/product/decisions.md

  - date: 2026-05
    id: moments-counter-cap-enforcement
    decision: 5-round counter-proposal cap for Moments enforced server-side (parent_id chain depth); client reflects but is not authoritative
    rationale: Client-side only enforcement is bypassable.
    source: docs/product/decisions.md

  - date: 2026-05
    id: trust-score-hard-caps
    decision: TrustScore clamped between 0 and 100 inclusive
    rationale: Prevents score drift outside meaningful range.
    source: docs/product/decisions.md

  - date: 2026-05
    id: notifications-circle-message-suppression
    decision: circle_message push suppressed when a live Action Cable subscription for that Circle is active
    rationale: Avoids duplicate notification when real-time channel is already open.
    source: docs/product/decisions.md

  - date: 2026-05
    id: notifications-token-rotation
    decision: APNs/FCM token rotation via NotificationJob; set device_tokens.active=false on invalid token
    rationale: Prevents repeated delivery failures and stale token accumulation.
    source: docs/product/decisions.md
