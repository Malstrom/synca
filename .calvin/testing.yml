strategy: TDD mandatory — red → green → refactor

backend:
  framework: Minitest
  fixtures: true (no FactoryBot in MVP)
  stubs: define_singleton_method on instance (not .stub on class)
  never: require "minitest/mock" explicitly — breaks Bootsnap on Ruby 3.3
  test_files: test/ only — never in app/ (Zeitwerk conflict)

ios:
  framework: XCTest
  mocks: HealthKitProtocol mock, MockURLProtocol for network
  no_uitests: true (add in Phase 2 for Spark + match flows)

coverage:
  tool: SimpleCov
  threshold: "≥ 90% line coverage; build fails below threshold"

always_test:
  - "Models: validations, scopes, enums, custom methods"
  - "Services: core logic, DB side-effects, error handling"
  - "Controllers: HTTP status, JSON structure, auth enforcement (401 on missing/invalid token)"
  - "Jobs: happy path, graceful skip on missing data, side-effect records"
  - "Channels: subscription accepted for authorized, rejected for non-members"

command: "bin/rails ci  # rubocop → bundle-audit → brakeman → rails test"
