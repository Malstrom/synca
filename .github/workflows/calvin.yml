name: Calvin

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  # ── calvin: title+body issue → ExploreFlow → PR ──────────────────────────
  calvin:
    if: github.event.label.name == 'calvin'
    uses: malstrom/calvin/.github/workflows/calvin-engine.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      target_repo: malstrom/synca
      auto_mode: true
    secrets:
      SYNCA_TOKEN: ${{ secrets.SYNCA_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
