name: Calvin

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  # ── calvin-direct: prompt da commento → Codestral → PR ─────────────────
  calvin-direct:
    if: github.event.label.name == 'calvin-direct'
    uses: malstrom/calvin/.github/workflows/calvin-engine.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      target_repo: malstrom/synca
      auto_mode: false
    secrets:
      SYNCA_TOKEN: ${{ secrets.SYNCA_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  # ── calvin-auto-body: usa title+body issue → Codestral → PR ───────────
  calvin-auto-body:
    if: github.event.label.name == 'calvin-auto-body'
    uses: malstrom/calvin/.github/workflows/calvin-engine.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      target_repo: malstrom/synca
      auto_mode: false
    secrets:
      SYNCA_TOKEN: ${{ secrets.SYNCA_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  # ── calvin-auto: esplora repo → Codestral → PR ──────────────────────
  calvin-auto:
    if: github.event.label.name == 'calvin-auto'
    uses: malstrom/calvin/.github/workflows/calvin-engine.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      target_repo: malstrom/synca
      auto_mode: true
    secrets:
      SYNCA_TOKEN: ${{ secrets.SYNCA_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
