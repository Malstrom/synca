name: CI — Rails API

on:
  push:
    branches: [ main ]
    paths:
      - "backend/api/**"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/api/**"

defaults:
  run:
    working-directory: backend/api

jobs:
  scan_ruby:
    name: Security Scan (Brakeman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Scan for Rails security vulnerabilities
        # --ignore-config suppresses known false positives tracked in config/brakeman.ignore
        run: bin/brakeman --no-pager --ignore-config config/brakeman.ignore

  gem_audit:
    name: Gem CVE Audit (bundler-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Update advisory database
        run: bundle exec bundle-audit update

      - name: Audit gems for CVEs
        run: bundle exec bundle-audit check

  lint:
    name: Linting (RuboCop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Run RuboCop (no autocorrect)
        run: bin/rubocop --format github

  test:
    name: Tests + Coverage (Minitest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      SECRET_KEY_BASE: a_dummy_secret_for_ci_at_least_64_chars_long_so_hmac_is_happy_1234

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
        working-directory: /tmp

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Set up database
        run: bin/rails db:create db:migrate

      - name: Run tests
        run: bin/rails test 2>&1 | tee /tmp/test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt

      - name: Check coverage threshold (≥ 90%)
        run: |
          COVERAGE=$(ruby -rjson -e '
            data = JSON.parse(File.read("coverage/.resultset.json"))
            result = data.values.first["coverage"]
            total_lines = 0; covered_lines = 0
            result.each_value do |file|
              next unless file.is_a?(Hash)
              lines = file["lines"] || []
              relevant = lines.compact
              total_lines += relevant.size
              covered_lines += relevant.count { |n| n > 0 }
            end
            pct = total_lines > 0 ? (covered_lines.to_f / total_lines * 100).round(2) : 0
            puts pct
          ')
          echo "Coverage: ${COVERAGE}%"
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | **90%** |" >> $GITHUB_STEP_SUMMARY
          ruby -e "exit 1 if ${COVERAGE}.to_f < 90" || {
            echo "❌ Coverage ${COVERAGE}% is below the 90% threshold." >> $GITHUB_STEP_SUMMARY
            echo "::error::Coverage ${COVERAGE}% is below the required 90% threshold"
            exit 1
          }
          echo "✅ Coverage ${COVERAGE}% meets the 90% threshold." >> $GITHUB_STEP_SUMMARY

  pr-report:
    name: PR Test Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Download test output
        uses: actions/download-artifact@v4
        with:
          name: test-output
          path: /tmp

      - name: Post failing tests as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/test-output.txt', 'utf8');
            const jobConclusion = '${{ needs.test.result }}';

            if (jobConclusion === 'success') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ **All tests passed!**'
              });
              return;
            }

            // Minitest failure blocks: numbered entries like "  1) Failure:" or "  1) Error:"
            // Each block ends at the next numbered entry or at the summary line (e.g. "X runs, Y assertions")
            const blocks = [];
            const lines = output.split('\n');
            let inBlock = false;
            let current = [];

            for (const line of lines) {
              if (/^\s+\d+\) (Failure|Error):/.test(line)) {
                if (current.length) blocks.push(current.join('\n'));
                current = [line];
                inBlock = true;
              } else if (inBlock) {
                // Stop at the summary line
                if (/^\d+ runs,/.test(line)) {
                  if (current.length) blocks.push(current.join('\n'));
                  current = [];
                  inBlock = false;
                } else {
                  current.push(line);
                }
              }
            }
            if (current.length) blocks.push(current.join('\n'));

            const failSection = blocks.length
              ? blocks.join('\n\n---\n\n')
              : output.slice(-3000);

            const body = [
              '## ❌ Failing Tests',
              '',
              '```',
              failSection,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
