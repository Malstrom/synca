name: CI — Rails API

on:
  push:
    branches: [ main ]
    paths:
      - "backend/api/**"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/api/**"

defaults:
  run:
    working-directory: backend/api

jobs:
  scan_ruby:
    name: Security Scan (Brakeman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Scan for Rails security vulnerabilities
        # --ignore-config suppresses known false positives tracked in config/brakeman.ignore
        run: |
          bin/brakeman --no-pager --ignore-config config/brakeman.ignore 2>&1 | tee /tmp/brakeman-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload brakeman output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brakeman-output
          path: /tmp/brakeman-output.txt

  gem_audit:
    name: Gem CVE Audit (bundler-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Update advisory database
        run: bundle exec bundle-audit update

      - name: Audit gems for CVEs
        run: |
          bundle exec bundle-audit check 2>&1 | tee /tmp/bundler-audit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload bundler-audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundler-audit-output
          path: /tmp/bundler-audit-output.txt

  lint:
    name: Linting (RuboCop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Run RuboCop (no autocorrect)
        run: bin/rubocop --format github

  test:
    name: Tests + Coverage (Minitest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      SECRET_KEY_BASE: a_dummy_secret_for_ci_at_least_64_chars_long_so_hmac_is_happy_1234

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config
        working-directory: /tmp

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.1"
          bundler-cache: true
          working-directory: backend/api

      - name: Set up database
        run: bin/rails db:create db:migrate

      - name: Run tests
        run: bin/rails test 2>&1 | tee /tmp/test-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt

      - name: Check coverage threshold (≥ 90%)
        run: |
          COVERAGE=$(ruby -rjson -e '
            data = JSON.parse(File.read("coverage/.resultset.json"))
            result = data.values.first["coverage"]
            total_lines = 0; covered_lines = 0
            result.each_value do |file|
              next unless file.is_a?(Hash)
              lines = file["lines"] || []
              relevant = lines.compact
              total_lines += relevant.size
              covered_lines += relevant.count { |n| n > 0 }
            end
            pct = total_lines > 0 ? (covered_lines.to_f / total_lines * 100).round(2) : 0
            puts pct
          ')
          echo "Coverage: ${COVERAGE}%"
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | **90%** |" >> $GITHUB_STEP_SUMMARY
          ruby -e "exit 1 if ${COVERAGE}.to_f < 90" || {
            echo "❌ Coverage ${COVERAGE}% is below the 90% threshold." >> $GITHUB_STEP_SUMMARY
            echo "::error::Coverage ${COVERAGE}% is below the required 90% threshold"
            exit 1
          }
          echo "✅ Coverage ${COVERAGE}% meets the 90% threshold." >> $GITHUB_STEP_SUMMARY

  pr-report:
    name: PR Test Report
    runs-on: ubuntu-latest
    needs: [test, scan_ruby, gem_audit]
    if: always() && github.event_name == 'pull_request'

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Download test output
        uses: actions/download-artifact@v4
        with:
          name: test-output
          path: /tmp/artifacts
        continue-on-error: true

      - name: Download brakeman output
        uses: actions/download-artifact@v4
        with:
          name: brakeman-output
          path: /tmp/artifacts
        continue-on-error: true

      - name: Download bundler-audit output
        uses: actions/download-artifact@v4
        with:
          name: bundler-audit-output
          path: /tmp/artifacts
        continue-on-error: true

      - name: Post unified PR comment (upsert)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-report -->';

            const readFile = (path) => {
              try { return fs.readFileSync(path, 'utf8'); } catch { return null; }
            };

            const testOutput    = readFile('/tmp/artifacts/test-output.txt');
            const brakemanOutput = readFile('/tmp/artifacts/brakeman-output.txt');
            const auditOutput   = readFile('/tmp/artifacts/bundler-audit-output.txt');

            const testResult    = '${{ needs.test.result }}';
            const brakemanResult = '${{ needs.scan_ruby.result }}';
            const auditResult   = '${{ needs.gem_audit.result }}';

            const allGreen = testResult === 'success' && brakemanResult === 'success' && auditResult === 'success';

            // ── Test section ──────────────────────────────────────────────
            let testSection = '';
            if (testResult === 'success') {
              testSection = '### ✅ Tests — all passed';
            } else {
              const blocks = [];
              if (testOutput) {
                const lines = testOutput.split('\n');
                let inBlock = false, current = [];
                for (const line of lines) {
                  if (/^\s+\d+\) (Failure|Error):/.test(line)) {
                    if (current.length) blocks.push(current.join('\n'));
                    current = [line]; inBlock = true;
                  } else if (inBlock) {
                    if (/^\d+ runs,/.test(line)) {
                      if (current.length) blocks.push(current.join('\n'));
                      current = []; inBlock = false;
                    } else { current.push(line); }
                  }
                }
                if (current.length) blocks.push(current.join('\n'));
              }
              const failBody = blocks.length
                ? blocks.join('\n\n---\n\n')
                : (testOutput ? testOutput.slice(-3000) : '_No output available_');
              testSection = `### ❌ Tests — failures\n\n\`\`\`\n${failBody}\n\`\`\``;
            }

            // ── Brakeman section ──────────────────────────────────────────
            let brakemanSection = '';
            if (brakemanResult === 'success') {
              brakemanSection = '### ✅ Brakeman — no issues';
            } else {
              const body = brakemanOutput ? brakemanOutput.slice(-3000) : '_No output available_';
              brakemanSection = `### ❌ Brakeman — security warnings\n\n\`\`\`\n${body}\n\`\`\``;
            }

            // ── Bundler-audit section ─────────────────────────────────────
            let auditSection = '';
            if (auditResult === 'success') {
              auditSection = '### ✅ Bundler-audit — no CVEs';
            } else {
              const body = auditOutput ? auditOutput.slice(-3000) : '_No output available_';
              auditSection = `### ❌ Bundler-audit — CVEs found\n\n\`\`\`\n${body}\n\`\`\``;
            }

            // ── Assemble body ─────────────────────────────────────────────
            const headline = allGreen ? '## ✅ CI — all checks passed' : '## ❌ CI — checks failed';
            const body = [MARKER, headline, '', testSection, '', brakemanSection, '', auditSection].join('\n');

            // ── Upsert: find existing bot comment with marker, update or create ──
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
