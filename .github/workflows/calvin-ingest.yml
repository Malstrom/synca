name: Calvin RAG Ingestion

on:
  # Trigger 1: PR mergiata su main
  pull_request:
    types: [closed]
    branches: [main]

  # Trigger 2: label 'ingest' aggiunta a qualsiasi PR aperta
  pull_request_target:
    types: [labeled]

jobs:
  ingest:
    runs-on: ubuntu-latest

    # Esegue se:
    #   a) PR mergiata su main, OPPURE
    #   b) label 'ingest' aggiunta alla PR
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'ingest')

    steps:
      - name: Checkout synca
        uses: actions/checkout@v4
        with:
          repository: Malstrom/synca
          path: synca

      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      - name: Configure git identity
        run: |
          git config --global user.email "calvin@synca.app"
          git config --global user.name "Calvin"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies
        run: bundle install
        working-directory: calvin/bin

      - name: Run ingestion — PR rules
        working-directory: calvin
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.SYNCA_TOKEN }}
        run: |
          bundle exec ruby bin/ingest.rb \
            --repo Malstrom/synca \
            --pr ${{ github.event.pull_request.number }}
