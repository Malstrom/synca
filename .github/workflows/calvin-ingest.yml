name: Calvin RAG Ingestion

on:
  # Trigger: PR mergiata su main
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  ingest:
    runs-on: ubuntu-latest

    # Solo se la PR è stata mergiata (non chiusa senza merge)
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout synca
        uses: actions/checkout@v4
        with:
          repository: Malstrom/synca
          path: synca

      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      - name: Configure git identity
        run: |
          git config --global user.email "calvin@synca.app"
          git config --global user.name "Calvin"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby dependencies
        run: bundle install
        working-directory: calvin/bin

      # Ingest regole dalla PR mergiata (solo bullet checkati nel commento <!-- calvin:rules -->)
      - name: Run ingestion — PR rules
        working-directory: calvin
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN:         ${{ secrets.SYNCA_TOKEN }}
        run: |
          bundle exec ruby bin/ingest.rb \
            --repo Malstrom/synca \
            --pr ${{ github.event.pull_request.number }}
