name: Calvin ingest fixtures

on:
  # Trigger automatico: push a main che modifica fixtures o test_helper
  push:
    branches: [main]
    paths:
      - "backend/api/test/fixtures/**"
      - "backend/api/test/test_helper.rb"

  # Trigger manuale: ingest iniziale o forzato
  # Vai su Actions > Calvin ingest fixtures > Run workflow
  workflow_dispatch:

jobs:
  ingest-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calvin
        uses: actions/checkout@v4
        with:
          repository: Malstrom/calvin
          token: ${{ secrets.SYNCA_TOKEN }}
          path: calvin

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby dependencies
        run: bundle install
        working-directory: calvin/bin

      - name: Build CLI argument
        id: cli_arg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Ingest manuale: reingesce tutto
            echo "arg=--all" >> $GITHUB_OUTPUT
          else
            # Push automatico: solo i file cambiati nel commit
            CHANGED=$(git -C $GITHUB_WORKSPACE diff --name-only ${{ github.event.before }} ${{ github.sha }} \
              | grep -E '^backend/api/test/fixtures/.*\.yml$|^backend/api/test/test_helper\.rb$' \
              | paste -sd ',' -)
            if [ -z "$CHANGED" ]; then
              echo "Nessun file rilevante cambiato, skip."
              echo "arg=" >> $GITHUB_OUTPUT
            else
              echo "arg=--changed ${CHANGED}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout synca (per git diff)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: Malstrom/synca
          token: ${{ secrets.SYNCA_TOKEN }}
          fetch-depth: 2

      - name: Run Calvin ingest fixtures
        if: steps.cli_arg.outputs.arg != ''
        run: |
          bundle exec ruby $GITHUB_WORKSPACE/calvin/bin/ingest_fixtures.rb \
            --repo Malstrom/synca \
            ${{ steps.cli_arg.outputs.arg }}
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/calvin/bin/Gemfile
          GITHUB_TOKEN: ${{ secrets.SYNCA_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
