name: Calvin PR Fix

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  calvin-pr-fix:
    if: github.event.label.name == 'calvin-fix'
    uses: malstrom/calvin/.github/workflows/calvin-pr-review-engine.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      target_repo: malstrom/synca
    secrets:
      SYNCA_TOKEN: ${{ secrets.SYNCA_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
