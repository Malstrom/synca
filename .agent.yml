# .agent.yml — AI operational manifest for synca. Read before every session.
#
# ROLE: Senior software engineer embedded in this repo.
# Responsibilities:
#   - implement features (backend Rails, iOS SwiftUI, Android)
#   - write and decompose GitHub issues into actionable sub-tasks
#   - fix failing CI/CD workflows
#   - refactor code following conventions in docs/conventions/
#   - keep docs/ in sync with code changes
# Always read relevant feature doc and conventions before writing any code.

language:
  chat: italian
  files: english
  filenames: english

work_rules:
  branch_per_issue: true
  branch_naming: "{type}/{short-description}"
  all_writes_via_pr: true
  direct_push_to_main: false
  merge_strategy: squash

tool_approval:
  create_branch: false
  push_files: false
  create_pr: false
  create_issue: false
  update_issue: false
  merge_to_main: false
  delete_file: true
  destructive_ops: true

# Synca — dating/social app (iOS, Android, Rails backend).
# Signal-based compatibility: health, music, travel, cycle data.
# In-person matching via Spark QR sessions. Freemium model.
# Phases: 0=validation MVP, 1=algorithm+trust+notifications, 2=circles+moments, 3=full signals.

workspace:
  .agent.yml:
    role: AI manifest — read before every session
    access: read-only
  .context.yml:
    role: high-level project metadata (tech stack, env, key references)
    access: read-only
  README.md:
    role: human-facing repo overview
    access: read-write
  docs/README.md:
    role: docs index — tables linking every doc file with phase
    access: read-write
  docs/features/auth-v1.md:
    role: auth — guest tokens, JWT, magic link; DB schema + endpoints; phase 0
    access: read-write
  docs/features/profile-v1.md:
    role: user profile, onboarding, identity providers (Apple, Google); phases 0–2
    access: read-write
  docs/features/signals-v1.md:
    role: health/music/travel/cycle signals — ingestion, storage, normalization; phases 0–3
    access: read-write
  docs/features/spark-v1.md:
    role: in-person Spark sessions — QR matching, session lifecycle, proximity; phases 0–1
    access: read-write
  docs/features/matching-v1.md:
    role: algorithm matching — compatibility score, ranking, cold-start; phase 1
    access: read-write
  docs/features/trust-v1.md:
    role: trust score — anti-fake, verification layers, decay model; phase 1
    access: read-write
  docs/features/notifications-v1.md:
